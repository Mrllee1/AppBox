server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 3601.help;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/appbox-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://3601.help$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 3601.help;

    ssl_certificate /etc/letsencrypt/live/3601.help/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3601.help/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AppBoxTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 200m;

    location ^~ /downloads/ {
        alias /var/lib/appbox/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600" always;
        limit_except GET HEAD {
            deny all;
        }
    }

    location = /health {
        proxy_pass http://127.0.0.1:39110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:39110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:39110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:39111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

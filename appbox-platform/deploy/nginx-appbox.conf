server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 3601.help;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/appbox-acme;
        default_type text/plain;
    }

    client_max_body_size 200m;

    # Converted IPA/NIVM artifacts are immutable downloads. nginx serves them
    # directly so iOS can use byte ranges and the API processes never buffer
    # large packages in memory.
    location ^~ /downloads/ {
        alias /var/lib/appbox/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600" always;
        limit_except GET HEAD {
            deny all;
        }
    }

    location = /health {
        proxy_pass http://127.0.0.1:39110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:39110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:39110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:39111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
